# OpenFox — generic deployment. See docs/DOCKER.md.
#
# Nothing machine-specific belongs in this file. Local paths, uid/gid and host
# mounts go in `docker-compose.override.yml` (git-ignored, loaded automatically)
# and tunables in `.env` (see `.env.example`).
name: openfox

services:
  openfox:
    build:
      context: .
    image: openfox:${OPENFOX_TAG:-local}
    restart: unless-stopped

    # The server listens on 0.0.0.0 inside the container, and the default auth
    # strategy is "local" (no password). The port is therefore published on the
    # loopback interface ONLY. Publishing it on all interfaces would expose an
    # unauthenticated agent that runs shell commands to your whole network; only
    # change OPENFOX_BIND together with network authentication or a reverse proxy.
    ports:
      - '${OPENFOX_BIND:-127.0.0.1}:${OPENFOX_PUBLISH_PORT:-10369}:10369'

    environment:
      OPENFOX_UID: '${OPENFOX_UID:-1000}'
      OPENFOX_GID: '${OPENFOX_GID:-1000}'
      # Forwarded to the Docker host so a provider configured as
      # http://localhost:<port> works unchanged. Empty string disables.
      OPENFOX_HOST_PORTS: '${OPENFOX_HOST_PORTS-1234,11434,8000,8080}'
      # The heap ceiling is a deployment setting, not a requirement: it is a limit
      # the process may grow to, not memory it reserves (an idle server uses tens
      # of MB). Setting OPENFOX_HEAP_INCREASED skips the CLI's own relaunch with a
      # 4-8 GB ceiling so the value below is the one that applies.
      OPENFOX_HEAP_INCREASED: '1'
      NODE_OPTIONS: '--max-old-space-size=${OPENFOX_HEAP_MB:-3072}'
      # `searxng` points web_search at the bundled SearXNG service (profile
      # `search` below). Empty leaves the search engine to Settings.
      OPENFOX_SEARCH: '${OPENFOX_SEARCH:-}'
    mem_limit: ${OPENFOX_MEM_LIMIT:-4g}

    # Where new projects are created by default, and the one folder mounted below.
    working_dir: /projects
    volumes:
      # Config, credentials and the session database. A named volume rather than
      # a host directory: SQLite in WAL mode is safer on the VM's own disk than
      # on a shared filesystem.
      - openfox-data:/data
      # Projects always stay on the host, never in the image.
      - ${OPENFOX_PROJECTS_DIR:-./projects}:/projects

    # Lets the container reach services on the Docker host by name; built in on
    # Docker Desktop, needed explicitly on Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Web search without an API key: a private SearXNG meta-search instance, only
  # reachable from the OpenFox container. Off by default; enable it with
  #   COMPOSE_PROFILES=search   and   OPENFOX_SEARCH=searxng     (in .env)
  # See docs/DOCKER.md.
  searxng:
    profiles: ['search']
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      # The instance is not published, so this is not a credential; SearXNG just
      # refuses to start with its placeholder default.
      SEARXNG_SECRET: '${SEARXNG_SECRET:-openfox-internal-searxng-not-published}'
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - '8080'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'

volumes:
  openfox-data:
